<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Find doctors | CareConnect</title><link rel="stylesheet" href="css/style.css"></head>
<body><header class="site-header"><a class="brand" href="index.html">Care<span>Connect</span></a><nav class="site-nav"><a href="index.html">Home</a><a class="active" href="doctors.html">Find doctors</a><a href="appointments.html" data-auth-link>Appointments</a><a href="auth.html" data-guest-link>Sign in</a><a href="#" data-logout hidden>Sign out</a></nav></header><main class="container"><section class="page-heading"><span class="eyebrow">FIND THE RIGHT CARE</span><h1 class="page-title">Meet our doctors</h1><p>Browse approved professionals and request a convenient appointment time.</p></section><div class="toolbar"><label class="search-field">Search doctors<input type="search" id="doctor-search" placeholder="Name, specialty or city"></label><label>Specialty<select id="doctor-specialty"><option value="">All specialties</option></select></label></div><div id="doctor-list" class="card-grid"><p class="loading">Loading approved doctors…</p></div></main>
