<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Doctor profile | CareConnect</title><link rel="stylesheet" href="css/style.css"></head>
<body><header class="site-header"><a class="brand" href="index.html">Care<span>Connect</span></a><nav class="site-nav"><a href="doctor-dashboard.html">Overview</a><a href="doctor-requests.html">Requests</a><a href="doctor-availability.html">Availability</a><a class="active" href="doctor-profile.html">Doctor profile</a><a href="#" data-logout>Sign out</a></nav></header><main class="container narrow"><section class="page-heading"><span class="eyebrow">YOUR PROFESSIONAL PROFILE</span><h1 class="page-title">Doctor profile</h1><p>Keep your public profile accurate and up to date.</p></section><section class="panel"><form data-doctor-profile-form class="form-grid"><label>Specialty<input name="specialty" required></label><label>Qualifications<input name="qualifications" required placeholder="e.g. MBBS, MD"></label><label>Years of experience<input name="experience_years" type="number" min="0" max="80" required></label><label>Consultation fee<input name="consultation_fee" type="number" min="0" step="1" required></label><label class="full-span">Clinic address<textarea name="clinic_address" rows="2" required></textarea></label><label class="full-span">About / bio<textarea name="bio" rows="5" maxlength="2000" required></textarea></label><p class="form-message full-span" data-form-message></p><button class="button full-span" type="submit">Save doctor profile</button></form></section></main><div id="toast" class="toast" role="status" aria-live="polite"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/supabase-client.js"></script><script src="js/auth.js"></script><script src="js/app.js"></script></body></html>
