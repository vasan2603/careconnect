<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Apply as a doctor | CareConnect</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html">Care<span>Connect</span></a>
    <nav class="site-nav"><a href="doctors.html">Find doctors</a><a class="active" href="apply-doctor.html">Doctor application</a><a href="#" data-logout>Sign out</a></nav>
  </header>
  <main class="container narrow">
    <section class="page-heading">
      <span class="eyebrow">JOIN OUR CARE NETWORK</span>
      <h1 class="page-title">Apply as a doctor</h1>
      <p>Share your professional details. Your application will be reviewed before your profile is listed.</p>
    </section>
    <section id="application-status" class="panel status-panel" hidden></section>
    <section class="panel">
      <form data-doctor-application-form class="form-grid">
        <label class="full-span">Full name<input name="full_name" autocomplete="name" required minlength="2"></label>
        <label>Specialty<input name="specialty" required></label>
        <label>Qualifications<input name="qualifications" required placeholder="e.g. MBBS, MD"></label>
        <label>Years of experience<input name="experience_years" type="number" min="0" max="80" required></label>
        <label>Consultation fee<input name="consultation_fee" type="number" min="0" step="1" required></label>
        <label class="full-span">Clinic address<textarea name="clinic_address" rows="2" required></textarea></label>
        <label class="full-span">Professional bio<textarea name="bio" rows="4" maxlength="2000" required></textarea></label>
        <p class="form-message full-span" data-form-message></p>
        <button class="button full-span" type="submit">Submit application</button>
      </form>
    </section>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
