<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign in | CareConnect</title><link rel="stylesheet" href="css/style.css"></head>
<body><header class="site-header"><a class="brand" href="index.html">Care<span>Connect</span></a><nav class="site-nav"><a href="index.html">Home</a><a href="doctors.html">Find doctors</a></nav></header>
<main class="container narrow"><a class="back-link" href="index.html">← Back to home</a><section class="panel auth-panel"><span class="eyebrow">WELCOME TO CARECONNECT</span><h1 class="page-title">Your care, all in one place.</h1><div class="tabs" role="tablist"><button class="tab active" type="button" data-auth-tab="signin">Sign in</button><button class="tab" type="button" data-auth-tab="signup">Sign up</button><button class="tab" type="button" data-auth-tab="forgot">Forgot password</button></div>
<form data-auth-form="signin"><label>Email address<input name="email" type="email" autocomplete="email" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required minlength="8"></label><p class="form-message" data-form-message></p><button class="button button-block" type="submit">Sign in</button></form>
<form data-auth-form="signup" hidden><label>Full name<input name="full_name" autocomplete="name" required minlength="2"></label><label>Email address<input name="email" type="email" autocomplete="email" required></label><label>Password<input name="password" type="password" autocomplete="new-password" required minlength="8"></label><p class="hint">Use at least 8 characters. Your profile can be completed after signing up.</p><p class="form-message" data-form-message></p><button class="button button-block" type="submit">Create account</button></form>
<form data-auth-form="forgot" hidden><p class="muted">Enter your email and we’ll send a password recovery link.</p><label>Email address<input name="email" type="email" autocomplete="email" required></label><p class="form-message" data-form-message></p><button class="button button-block" type="submit">Send recovery link</button></form>
</section></main>
<div id="toast" class="toast" role="status" aria-live="polite"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/supabase-client.js"></script><script src="js/auth.js"></script><script src="js/app.js"></script></body></html>
