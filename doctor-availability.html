<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Manage availability | CareConnect</title><link rel="stylesheet" href="css/style.css"></head>
<body><header class="site-header"><a class="brand" href="index.html">Care<span>Connect</span></a><nav class="site-nav"><a href="doctor-dashboard.html">Overview</a><a href="doctor-requests.html">Requests</a><a class="active" href="doctor-availability.html">Availability</a><a href="doctor-profile.html">Doctor profile</a><a href="#" data-logout>Sign out</a></nav></header><main class="container"><section class="page-heading"><span class="eyebrow">PLAN YOUR CLINIC HOURS</span><h1 class="page-title">Manage availability</h1><p>Add dates and working hours. Appointment slots are generated in 30-minute intervals.</p></section><section class="panel"><form data-availability-form class="form-grid"><label>Available date<input name="available_date" type="date" required></label><label>Slot duration<select name="slot_duration" required><option value="30">30 minutes</option></select></label><label>Start time<input name="start_time" type="time" required></label><label>End time<input name="end_time" type="time" required></label><p class="form-message full-span" data-form-message></p><button class="button full-span" type="submit">Add availability</button></form></section><section class="section compact-section"><h2>Upcoming availability</h2><div id="availability-list" class="stack-list"><p class="loading">Loading availability…</p></div></section></main><div id="toast" class="toast" role="status" aria-live="polite"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/supabase-client.js"></script><script src="js/auth.js"></script><script src="js/app.js"></script></body></html>
