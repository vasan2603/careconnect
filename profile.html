<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My profile | CareConnect</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html">Care<span>Connect</span></a>
    <nav class="site-nav"><a href="doctors.html">Find doctors</a><a href="appointments.html">Appointments</a><a class="active" href="profile.html">My profile</a><a href="#" data-logout>Sign out</a></nav>
  </header>
  <main class="container narrow">
    <section class="page-heading"><span class="eyebrow">YOUR ACCOUNT</span><h1 class="page-title">My profile</h1><p>Manage your contact details and profile photo.</p></section>
    <section class="panel">
      <form data-profile-form class="form-grid">
        <div class="avatar-editor full-span">
          <img id="avatar-preview" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 96 96'%3E%3Crect width='96' height='96' rx='48' fill='%23e2f4ef'/%3E%3Ctext x='50%25' y='58%25' text-anchor='middle' font-family='Arial' font-size='24' fill='%23087f72'%3ECC%3C/text%3E%3C/svg%3E" alt="Profile avatar">
          <label>Profile photo<input name="avatar" id="avatar-file" type="file" accept="image/*"></label>
        </div>
        <label>Full name<input name="full_name" required minlength="2"></label>
        <label>Phone<input name="phone" type="tel" minlength="7" maxlength="20" required></label>
        <label>Date of birth<input name="date_of_birth" type="date"></label>
        <label>Gender<select name="gender"><option value="">Select</option><option>Female</option><option>Male</option><option>Non-binary</option><option>Prefer not to say</option></select></label>
        <label>City<input name="city"></label>
        <label>Address<input name="address"></label>
        <p class="form-message full-span" data-form-message></p>
        <button class="button full-span" type="submit">Save changes</button>
      </form>
    </section>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
